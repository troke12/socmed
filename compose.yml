services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: socmed-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SOCMED_DB_PATH: /app/data/app.db
      SOCMED_UPLOADS_DIR: /app/data/uploads
      # Next.js standalone binds to HOSTNAME by default (the container
      # hostname), which breaks localhost healthchecks. Force 0.0.0.0.
      HOSTNAME: 0.0.0.0
    ports:
      # Default access: http://localhost:8080 (no TLS for local dev).
      # In production behind Caddy you can drop this mapping.
      - "8080:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: socmed-worker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SOCMED_DB_PATH: /app/data/app.db
      SOCMED_UPLOADS_DIR: /app/data/uploads
    volumes:
      - ./data:/app/data
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  # TLS reverse proxy — opt-in. Run with: docker compose --profile tls up
  # or set COMPOSE_PROFILES=tls. For local dev, http://localhost:8080 is enough.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SOCMED_DOMAIN: ${SOCMED_DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

volumes:
  caddy_data:
  caddy_config:
